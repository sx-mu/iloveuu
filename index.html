<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Per Te ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        padding: 20px;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
        box-sizing: border-box;
    }   

    .card {
        background: rgba(255, 255, 255, 0.15);
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        cursor: pointer;
    }

    .step {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
        animation: appear 0.8s;
    }

    .text {
        font-size: 1.4em;
        text-align: center;
    }

    .photo {
        width: 100%;
        height: auto;
        max-height: 260px;
        object-fit: cover;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }


    .hint {
        font-size: 0.8em;
        margin-top: 10px;
        opacity: 0.8;
        text-align: center;
    }

    @keyframes appear {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 700px) {
        .step {
            flex-direction: row;
        }

        .text {
            flex: 1;
            text-align: left;
        }

        .photo {
            width: 220px;
            height: 220px;
        }
    }
</style>
</head>

<body>

<div class="card" id="card">
    <div id="content"></div>
    <div class="hint" id="hint">(tocca lo schermo)</div>
</div>

<script>
    const music = document.getElementById("music");

function startMusic() {
    music.volume = 0.4;
    music.play().catch(() => {});
    document.removeEventListener("click", startMusic);
    document.removeEventListener("touchstart", startMusic);
}

// per iPhone / Android
document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);

const steps = [
    { text: "sappi che mi sono impegnato molto per sta cagata.", img: "foto1.jpg" },
    { text: "però ne è valsa la pena e spero ti piaccia", img: "foto2.jpg" },
    { text: "buon san valentino my blood✌️❤️", img: "foto3.jpg" },
    { text: "love u so so much🫰❤️", img: "foto4.jpg" }
];

let index = 0;
const content = document.getElementById("content");
const hint = document.getElementById("hint");
const card = document.getElementById("card");

function renderStep() {
    content.innerHTML = "";

    const step = steps[index];
    const container = document.createElement("div");
    container.className = "step";

    if (step.text) {
        const text = document.createElement("div");
        text.className = "text";
        text.innerHTML = step.text;
        container.appendChild(text);
    }

    if (step.img) {
        const img = document.createElement("img");
        img.src = step.img;
        img.className = "photo";
        container.appendChild(img);
    }

    content.appendChild(container);

    // ultimo step → stop
    if (index === steps.length - 1) {
        hint.style.display = "none";
        card.removeEventListener("click", next);
    }
}

function next() {
    if (index < steps.length) {
        renderStep();
        index++;
    }
}

// primo step automatico
function next() {

    // musica parte AL PRIMO TAP (iPhone-safe)
    if (index === 0) {
        const music = document.getElementById("music");
        music.volume = 0.4;
        music.play().catch(() => {});
    }

    if (index < steps.length) {
        renderStep();
        index++;
    }
}


// click SOLO sulla card (più affidabile)
card.addEventListener("click", next);
</script>

<audio id="music" loop>
    <source src="audio1.mp3" type="audio/mpeg">
</audio>

</body>
</html>
